name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the exe to a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Version drives BOTH -X main.Version (surfaced at /api/health) and the
      # release asset's filename. FIM-AV Assistant downloads by that filename
      # (youtube-tba-upload-<version>.exe) exactly as it does live-captions, so
      # the version must be baked into the name, not just the binary. Tags carry
      # the leading v (v0.1.0); the filename and reported version drop it.
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#v}"
            echo "v=$v" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # The store is a plain JSON manifest now (no cgo), so the Windows uploader
      # cross-compiles on ubuntu with no Windows runner.
      - name: Cross-compile Windows exe
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-X main.Version=${{ steps.ver.outputs.v }}" -o "dist/youtube-tba-upload-${{ steps.ver.outputs.v }}.exe" .

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-tba-upload-windows-amd64
          path: dist/youtube-tba-upload-*.exe
          if-no-files-found: error

      - name: Attach exe to Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/youtube-tba-upload-*.exe
